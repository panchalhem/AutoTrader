name: Build desktop installers

# Push a tag like v1.0.0 to build the Windows .exe and Mac .dmg and attach
# them to a new GitHub Release automatically — no local Windows/Mac machine
# needed. Trigger manually from the Actions tab (workflow_dispatch) to test
# a build without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend_script: desktop/build-backend.ps1
            dist_script: dist:win
          - os: macos-latest
            backend_script: desktop/build-backend.sh
            dist_script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frozen Python backend (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File build-backend.ps1
        working-directory: desktop

      - name: Build frozen Python backend (macOS)
        if: runner.os == 'macOS'
        run: bash build-backend.sh
        working-directory: desktop

      - name: Install Electron app deps
        run: npm install
        working-directory: desktop

      - name: Build installer
        run: npm run ${{ matrix.dist_script }}
        working-directory: desktop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotrader-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
